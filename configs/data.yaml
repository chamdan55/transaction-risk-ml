data:
  raw_path: data/raw/paysim.csv
  processed_path: data/processed
  sample_path: data/sample

dataset:
  name: paysim
  source: kaggle
  source_url: https://www.kaggle.com/datasets/ealaxi/paysim1

reproducibility:
  seed: 42

time:
  base_timestamp: "2026-01-01T00:00:00"

split:
  train_ratio: 0.70
  validation_ratio: 0.15
  test_ratio: 0.15
  # exact preserves row-count boundaries; time_boundary avoids global row_number for large data.
  strategy: time_boundary
  quantile_relative_error: 0.01

spark:
  master: local[2]
  driver_memory: 16g          # hanya bila RAM host mencukupi
  shuffle_partitions: 32
  default_parallelism: 8
  output_partitions: 8
  persist_intermediates: false
