data:
  features_path: data/processed/features
  target_column: is_fraud
  excluded_columns:
    - transaction_id
    - timestamp
    - origin_account_id
    - destination_account_id
    - is_fraud
    - is_flagged_fraud

training:
  random_seed: 42
  primary_metric: pr_auc
  imbalance_strategy: balanced

models:
  logistic_regression:
    max_iter: 1000
    class_weight: balanced
  random_forest:
    n_estimators: 200
    max_depth: null
    class_weight: balanced
    n_jobs: -1
  xgboost:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    eval_metric: logloss
    tree_method: hist

evaluation:
  thresholds:
    - 0.10
    - 0.20
    - 0.30
    - 0.40
    - 0.50

outputs:
  model_directory: artifacts/models
  evaluation_report: artifacts/evaluation_report.json
