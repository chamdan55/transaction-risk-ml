name: transaction-risk-ml

services:
  model-seed:
    build:
      context: .
      target: model-bundle
    command: ["sh", "-c", "cp /bundle/* /models/"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - model-artifacts:/models
    networks:
      - private

  api:
    build:
      context: .
      target: serving
    depends_on:
      model-seed:
        condition: service_completed_successfully
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MODEL_SOURCE: local
      MODEL_ARTIFACT_PATH: /models/random_forest.joblib
      MODEL_EVALUATION_REPORT_PATH: /models/evaluation_report.json
      API_AUTH_ENABLED: ${API_AUTH_ENABLED:-false}
      API_KEY: ${API_KEY:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/health/ready', timeout=2).status == 200"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
    volumes:
      - model-artifacts:/models:ro
    networks:
      - edge
      - private

  postgres:
    image: postgres:16.15-alpine3.24
    profiles: ["tracking"]
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 10s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - private

  minio:
    image: minio/minio:RELEASE.2025-04-03T14-56-28Z
    profiles: ["tracking"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10
    volumes:
      - minio-data:/data
    networks:
      - private

  minio-init:
    image: minio/mc:RELEASE.2025-02-08T19-14-21Z
    profiles: ["tracking"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" && mc mb --ignore-existing local/mlflow"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    networks:
      - private

  mlflow:
    build:
      context: .
      target: training
    profiles: ["tracking"]
    command: >-
      sh -c "mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://mlflow:$$POSTGRES_PASSWORD@postgres:5432/mlflow
      --default-artifact-root s3://mlflow"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
      - private

volumes:
  model-artifacts:
  postgres-data:
  minio-data:

networks:
  edge:
  private:
    internal: true
