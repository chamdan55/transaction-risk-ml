name: transaction-risk-ml

# podman-compose can otherwise place the Compose project in a Pod. On Windows,
# published ports in that mode can fail with an opaque "internal libpod error".
# The services already communicate through explicit Compose networks, so no Pod
# is required for this local runtime.
x-podman:
  in_pod: false

services:
  api:
    build:
      context: .
      target: serving-with-model
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-false}
      MODEL_SOURCE: local
      MODEL_ARTIFACT_PATH: /models/random_forest.joblib
      MODEL_EVALUATION_REPORT_PATH: /models/evaluation_report.json
      ML_MONITORING_DATABASE_PATH: /var/lib/transaction-risk/monitoring/events.sqlite3
      ML_MONITORING_QUEUE_MAXSIZE: ${ML_MONITORING_QUEUE_MAXSIZE:-5000}
      ML_MONITORING_RETENTION_DAYS: ${ML_MONITORING_RETENTION_DAYS:-90}
      API_AUTH_ENABLED: ${API_AUTH_ENABLED:-false}
      API_KEY: ${API_KEY:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    read_only: true
    volumes:
      - monitoring-data:/var/lib/transaction-risk/monitoring
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/health/ready', timeout=2).status == 200"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
    networks:
      - edge
      - private

  prometheus:
    image: prom/prometheus:v3.0.1
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - edge
      - private

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["monitoring"]
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-before-sharing}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - edge
      - private

  monitoring-report:
    build:
      context: .
      target: monitoring
    profiles: ["monitoring-job"]
    environment:
      MODEL_SOURCE: local
      MODEL_ARTIFACT_PATH: /models/random_forest.joblib
      MODEL_EVALUATION_REPORT_PATH: /models/evaluation_report.json
      ML_MONITORING_DATABASE_PATH: /var/lib/transaction-risk/monitoring/events.sqlite3
      ML_MONITORING_RETENTION_DAYS: ${ML_MONITORING_RETENTION_DAYS:-90}
    command: ["python", "-m", "pipelines.run_monitoring"]
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - monitoring-data:/var/lib/transaction-risk/monitoring
      - ./artifacts/models:/models:ro
      - ./artifacts/evaluation_report.json:/models/evaluation_report.json:ro
      - ./data/processed/features:/workspace/data/processed/features:ro
      - ./artifacts/monitoring/reports:/workspace/artifacts/monitoring/reports
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16.15-alpine3.24
    profiles: ["tracking"]
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 10s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - private

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-03T14-56-28Z
    profiles: ["tracking"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10
    volumes:
      - minio-data:/data
    networks:
      - private

  minio-init:
    build:
      context: .
      target: minio-init
    profiles: ["tracking"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    # podman-compose splits scalar commands into argv; sh -c needs one script argument.
    command:
      - >-
        mc --config-dir /tmp/mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        && mc --config-dir /tmp/mc mb --ignore-existing local/mlflow
        && exec tail -f /dev/null
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "mc --config-dir /tmp/mc ls local/mlflow >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10
    tmpfs:
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - private

  mlflow:
    build:
      context: .
      target: tracking-server
    profiles: ["tracking"]
    command:
      - sh
      - -c
      - >-
        exec mlflow server --host 0.0.0.0 --port 5000
        --backend-store-uri postgresql+psycopg2://mlflow:$$POSTGRES_PASSWORD@postgres:5432/mlflow
        --artifacts-destination s3://mlflow --workers 1
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-}
      AWS_DEFAULT_REGION: us-east-1
      HOME: /tmp
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:5000/health', timeout=3).status == 200"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 10
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
      - private

volumes:
  monitoring-data:
  postgres-data:
  minio-data:
  prometheus-data:
  grafana-data:

networks:
  edge:
  private:
    internal: true
